<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Power Platform Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f6f4ee;
  --paper-raised:#ffffff;
  --ink:#1c1b18;
  --ink-soft:#5b574c;
  --line:#e3ddce;
  --line-strong:#cfc7b2;
  --accent:#b5651d;
  --accent-ink:#7a4310;
  --accent-soft:#f1e1cd;
  --good:#3f6b46;
  --good-soft:#e6efe1;
  --bad:#a3402f;
  --bad-soft:#f6e5df;
  --cat-powerbi:#2c6083;
  --cat-powerapps:#6d4a94;
  --cat-automate:#3d7d63;
  --cat-integration:#736c58;
  --cat-maintenance:#9a4b2c;
  --cat-scenario:#7a4310;
  --shadow: 0 1px 2px rgba(28,27,24,.04), 0 8px 24px -12px rgba(28,27,24,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17161a;
    --paper-raised:#201e22;
    --ink:#ece7dc;
    --ink-soft:#a49d8c;
    --line:#332f30;
    --line-strong:#463f3c;
    --accent:#e0975a;
    --accent-ink:#f2b884;
    --accent-soft:#3a2a1c;
    --good:#8fbf94;
    --good-soft:#213228;
    --bad:#e08b7a;
    --bad-soft:#3a2420;
    --cat-powerbi:#7fb2d6;
    --cat-powerapps:#b79bd9;
    --cat-automate:#82c4a5;
    --cat-integration:#b8b09a;
    --cat-maintenance:#dd9068;
    --cat-scenario:#e0ac6f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --paper:#17161a;
  --paper-raised:#201e22;
  --ink:#ece7dc;
  --ink-soft:#a49d8c;
  --line:#332f30;
  --line-strong:#463f3c;
  --accent:#e0975a;
  --accent-ink:#f2b884;
  --accent-soft:#3a2a1c;
  --good:#8fbf94;
  --good-soft:#213228;
  --bad:#e08b7a;
  --bad-soft:#3a2420;
  --cat-powerbi:#7fb2d6;
  --cat-powerapps:#b79bd9;
  --cat-automate:#82c4a5;
  --cat-integration:#b8b09a;
  --cat-maintenance:#dd9068;
  --cat-scenario:#e0ac6f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:40px 20px 64px}
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.masthead h1{
  font-size:22px;font-weight:700;margin:0;letter-spacing:-0.01em;
}
.masthead .kicker{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 4px;
}
.masthead-sub{color:var(--ink-soft);font-size:13px;font-family:"IBM Plex Mono",monospace}

.card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:28px 28px 24px;
}

.rail-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;font-weight:600;
  background:var(--accent-soft);color:var(--accent-ink);
  border:1px solid transparent;
}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
select.jump{
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-soft);
  background:transparent;border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;
}

.progress-track{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease}
.meta-row{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.question{
  font-size:21px;line-height:1.4;font-weight:600;margin:24px 0 18px;letter-spacing:-0.01em;
  text-wrap:balance;
}

.options{display:flex;flex-direction:column;gap:10px}
.option{
  display:flex;align-items:flex-start;gap:12px;
  padding:13px 14px;border:1px solid var(--line);border-radius:11px;
  cursor:pointer;background:var(--paper-raised);
  transition:border-color .15s ease, background .15s ease;
}
.option:hover{border-color:var(--accent);background:var(--accent-soft)}
.option input{margin-top:3px;accent-color:var(--accent)}
.opt-letter{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--ink-soft);
  border:1px solid var(--line-strong);border-radius:5px;width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;
}
.option span.opt-text{font-size:15px;line-height:1.45}
.option.correct{border-color:var(--good);background:var(--good-soft)}
.option.correct .opt-letter{border-color:var(--good);color:var(--good)}
.option.incorrect{border-color:var(--bad);background:var(--bad-soft)}
.option.incorrect .opt-letter{border-color:var(--bad);color:var(--bad)}

.feedback{display:none;margin-top:16px;padding:13px 15px;border-radius:10px;font-weight:600;font-size:14px}
.feedback.good{display:block;background:var(--good-soft);color:var(--good)}
.feedback.bad{display:block;background:var(--bad-soft);color:var(--bad)}
.explanation{display:none;margin-top:8px;color:var(--ink-soft);font-size:14px;line-height:1.5}

.controls{display:flex;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
button{
  font-family:"IBM Plex Sans",sans-serif;border:0;border-radius:9px;padding:11px 18px;
  font-weight:600;font-size:14px;cursor:pointer;transition:opacity .15s ease, transform .1s ease;
}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);color:#ffffff}
button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
button:disabled{opacity:.35;cursor:not-allowed}
.controls .spacer{flex:1}

.results{display:none;text-align:center}
.results .kicker{color:var(--ink-soft)}
.results h2{font-size:20px;margin:2px 0 18px}
.scorebig{font-family:"IBM Plex Mono",monospace;font-size:60px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.readiness{color:var(--ink-soft);margin-top:4px;font-size:14px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0}
.stat{padding:16px 8px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.stat strong{display:block;font-family:"IBM Plex Mono",monospace;font-size:26px;font-variant-numeric:tabular-nums;margin-bottom:2px}
.stat span{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;font-family:"IBM Plex Mono",monospace}

.catbreak{margin:26px 0;text-align:left}
.catbreak-title{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px}
.catbar-row{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:10px;margin-bottom:7px;font-size:12px}
.catbar-track{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.catbar-fill{height:100%;border-radius:999px}
.catbar-name{color:var(--ink-soft);font-family:"IBM Plex Mono",monospace;font-size:11px}
.catbar-score{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.review{text-align:left;margin-top:8px}
.review-item{padding:14px 0;border-top:1px solid var(--line)}
.review-item .rq{font-weight:600;font-size:14.5px;margin-bottom:6px}
.review-item .rc{color:var(--good);font-size:13.5px;margin-bottom:4px}
.review-item .re{color:var(--ink-soft);font-size:13px;line-height:1.5}

@media (max-width:600px){
  .statgrid{grid-template-columns:1fr 1fr}
  .catbar-row{grid-template-columns:88px 1fr 36px}
  .card{padding:20px 18px 18px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <p class="kicker">Interview drill</p>
      <h1>Power Platform &amp; Maintenance Ops</h1>
    </div>
    <div class="masthead-sub" id="masthead-sub">100 questions</div>
  </div>

  <div class="card" id="quizPanel">
    <div class="rail-row">
      <span class="chip" id="cat"><span class="dot"></span><span id="catText"></span></span>
      <select class="jump" id="jump" onchange="jumpQ()"></select>
    </div>
    <div class="progress-track"><div class="progress-fill" id="bar"></div></div>
    <div class="meta-row"><span id="count"></span><span id="score">Score 0</span></div>

    <div class="question" id="q"></div>
    <div class="options" id="opts"></div>
    <div class="feedback" id="fb"></div>
    <div class="explanation" id="exp"></div>

    <div class="controls">
      <button class="secondary" id="prev" onclick="prevQ()">Previous</button>
      <span class="spacer"></span>
      <button class="primary" id="check" onclick="checkAnswer()">Check answer</button>
      <button class="secondary" id="next" onclick="nextQ()">Next</button>
    </div>
  </div>

  <div class="card results" id="results">
    <p class="kicker">Session complete</p>
    <h2>Your score</h2>
    <div class="scorebig" id="pct"></div>
    <div class="readiness" id="ready"></div>
    <div class="statgrid">
      <div class="stat"><strong id="cN">0</strong><span>Correct</span></div>
      <div class="stat"><strong id="wN">0</strong><span>Missed</span></div>
      <div class="stat"><strong>100</strong><span>Total</span></div>
    </div>
    <div class="catbreak">
      <div class="catbreak-title">By category</div>
      <div id="catbars"></div>
    </div>
    <button class="primary" onclick="restart()">Restart quiz</button>
    <div class="review" id="review"></div>
  </div>
</div>

<script>
const questions = [["Power BI", "What is Power BI?", ["A business intelligence and data visualization tool", "A relational database engine for transaction processing", "A scripting language for automating spreadsheets", "An operating system for enterprise servers"], 0, "Power BI is Microsoft's business intelligence and data visualization platform."], ["Power BI", "Why do companies use Power BI?", ["To design marketing graphics and logos", "To analyze data and support decision-making", "To replace their operating systems", "To build mobile apps exclusively"], 1, "Companies use Power BI to analyze data, monitor KPIs, and support decisions."], ["Power BI", "Which tool is mainly used to build Power BI reports locally?", ["Microsoft Word", "Power Automate Desktop", "Power BI Desktop", "SharePoint Designer"], 2, "Power BI Desktop is the primary report-building application."], ["Power BI", "What is Power BI Service mainly used for?", ["Writing and compiling Java applications", "Editing and rendering videos", "Managing network printers", "Publishing and sharing reports in the cloud"], 3, "Power BI Service is the cloud platform for publishing, sharing, refreshing, and managing reports."], ["Power BI", "What is Power Query used for?", ["Data cleaning and transformation", "Drafting and sending emails", "Monitoring network traffic", "Authenticating user logins"], 0, "Power Query is used to prepare and transform data before analysis."], ["Power BI", "What does ETL stand for?", ["Enter, Track, Log", "Extract, Transform, Load", "Evaluate, Test, Launch", "Export, Transfer, Link"], 1, "ETL means Extract, Transform, Load."], ["Power BI", "What is DAX?", ["A relational database server", "A general-purpose web browser", "A formula language used in Power BI", "A compressed file format"], 2, "DAX stands for Data Analysis Expressions."], ["Power BI", "Which is an example of a DAX measure?", ["SELECT * FROM Sales ORDER BY Amount DESC", "print('Total Sales: ' + str(amount))", "GET /api/sales?year=2026&region=all", "Total Sales = SUM(Sales[Amount])"], 3, "Measures in Power BI are written in DAX."], ["Power BI", "What is a calculated column?", ["A row-by-row calculated field stored in the model", "A trigger used inside Power Automate flows", "A page shown on a report dashboard", "A permission set on a SharePoint site"], 0, "Calculated columns are evaluated for each row and stored."], ["Power BI", "What is a measure?", ["A static text field with a fixed value", "A dynamic calculation affected by filter context", "A table stored in a SQL database", "A record of a user account"], 1, "Measures recalculate dynamically based on report filters."], ["Power BI", "What is a star schema?", ["A layout style used for network topology diagrams", "A visual theme used in report design", "A model with a fact table connected to dimension tables", "A template used to build Power Apps screens"], 2, "Star schema is a common BI modeling approach."], ["Power BI", "What is a fact table?", ["A table containing only color codes", "A table used only for security roles", "A table listing app screen names", "A table containing measurable transactions"], 3, "Fact tables contain transactions and numerical measures."], ["Power BI", "What is a dimension table?", ["A table with descriptive attributes", "A table containing only stored passwords", "A table used only by external APIs", "A log of flow run history"], 0, "Dimension tables contain descriptive details such as customer or date."], ["Power BI", "What is a slicer?", ["A connector to on-premises data", "An interactive report filter", "A built-in DAX function", "A step in an approval workflow"], 1, "Slicers allow users to filter report data interactively."], ["Power BI", "What is drill-down?", ["Sending a request through an approval workflow process", "Permanently deleting a dataset from a workspace", "Moving through hierarchy levels in a visual", "Creating a brand-new Power App from a blank canvas"], 2, "Drill-down moves from a higher level to more detail inside a hierarchy."], ["Power BI", "What is drill-through?", ["Cleaning and reshaping raw source data before loading it", "Refreshing a linked Excel workbook stored in SharePoint", "Provisioning new user accounts inside an organization", "Opening a detailed report page filtered by a selected value"], 3, "Drill-through opens a more detailed page filtered to the selected item."], ["Power BI", "What is Row-Level Security?", ["Restricting which data rows users can see", "Protecting only the dashboard's color theme", "Encrypting a user's laptop hard drive", "Building new DAX calculations"], 0, "RLS controls data visibility by user or role."], ["Power BI", "What does KPI mean?", ["Known Process Input", "Key Performance Indicator", "Key Program Interface", "Kernel Performance Index"], 1, "KPI stands for Key Performance Indicator."], ["Power BI", "Why is a data gateway used?", ["To build mobile apps from scratch", "To replace an on-premises SQL Server", "To connect Power BI Service to on-premises data", "To send bulk SMS notifications"], 2, "A gateway allows Power BI Service to access supported on-premises data."], ["Power BI", "What does data refresh do?", ["Deletes every visual on the report", "Resets all user account passwords", "Creates a new Power Automate workflow", "Updates report data from the source"], 3, "Refresh updates the report model with current source data."], ["Power BI", "Which visual is good for showing a single KPI?", ["A card visual", "A scatter plot only", "A filled map only", "A plain button control"], 0, "Card visuals are commonly used for single KPI values."], ["Power BI", "Which function is especially important in DAX for changing filter context?", ["PATCH", "CALCULATE", "NAVIGATE", "HTTP"], 1, "CALCULATE evaluates an expression under modified filter context."], ["Power BI", "What is filter context?", ["The layout of the report's login page", "The status code of an API response", "The active filters affecting a calculation", "The cached files stored by a browser"], 2, "Filter context determines which data is included in a DAX evaluation."], ["Power BI", "Which is usually better for aggregations and KPIs?", ["Calculated columns only", "Static images", "Plain text labels", "Measures"], 3, "Measures are dynamic and generally preferred for aggregations."], ["Power BI", "What is a good first step to improve a slow Power BI model?", ["Review model design and remove unnecessary columns", "Add several more visuals onto the same report page", "Duplicate the largest tables inside the data model", "Increase the font size used on every report label"], 0, "Optimizing the model and reducing unnecessary data often improves performance."], ["Power Apps", "What is Power Apps?", ["A relational database engine", "A low-code business application platform", "A video editing application", "A general-purpose web browser"], 1, "Power Apps is Microsoft's low-code app development platform."], ["Power Apps", "What is a Canvas App?", ["A scheduled backup of a database", "A dashboard built only in Power BI", "A UI-first app with flexible screen design", "A recurring cloud flow"], 2, "Canvas Apps provide flexible control over the interface."], ["Power Apps", "What is a Model-Driven App?", ["A viewer used only for reading PDFs", "A script that runs only on the desktop", "A rule that forwards or replies to email", "A Dataverse-centered business application"], 3, "Model-Driven Apps are built around Dataverse data, forms, and processes."], ["Power Apps", "Canvas App vs Model-Driven App: which statement is correct?", ["Canvas is UI-first; Model-Driven is data-first", "They are functionally identical in every way", "Model-Driven only works with Excel files", "Canvas Apps cannot connect to any data source"], 0, "Canvas Apps emphasize UI flexibility; Model-Driven Apps emphasize structured Dataverse data."], ["Power Apps", "What is Power Fx?", ["A relational database engine", "The formula language used in Power Apps", "A ds the form's current values to the connected data source."], ["Power Apps", "What is Navigate used for?", ["Sending outbound REST API requests", "Moving between app screens", "Creating new tables in a database", "Refreshing a Power BI dataset"], 1, "Navigate moves the user from one screen to another."], ["Power Apps", "What is Notify used for?", ["Creating a brand-new database", "Generating a DAX calculation", "Showing a user message", "Setting up a data gateway"], 2, "Notify displays messages such as success or error notifications."], ["Power Apps", "Why is validation important?", ["To deliberately slow down how quickly the app responds", "To completely hide every record from every app user", "To act as a full substitute for proper data security", "To ensure required and correct data before submission"], 3, "Validation prevents incomplete or invalid data from being submitted."], ["Power Apps", "What is a variable?", ["A temporary stored value used in app logic", "A published Power BI report", "A dedicated SQL database server", "A cookie stored by a web browser"], 0, "Variables store values that can be reused within app logic."], ["Power Apps", "What is a collection?", ["A workspace inside Power BI Service", "A temporary in-app table", "A rule configured on a network firewall", "A site collection inside SharePoint only"], 1, "Collections store multiple records temporarily in an app session."], ["Power Apps", "What is delegation?", ["Manually copying data between two apps", "Publishing a finished app to users", "Sending supported processing to the data source", "Sending an automated email alert"], 2, "Delegation lets the data source perform supported filtering or calculations."], ["Power Apps", "Why does delegation matter?", ["It changes the app's visual color scheme", "It automatically creates new user accounts", "It disables the app's security settings", "It helps work correctly with large datasets"], 3, "Non-delegable formulas can produce incomplete results on la  ["A Power BI slicer", "A calculated column", "A Canvas App theme", "A trigger condition"], 3, "Trigger conditions prevent unnecessary flow runs."]];
const CAT_COLOR = {
  "Power BI":"var(--cat-powerbi)",
  "Power Apps":"var(--cat-powerapps)",
  "Power Automate":"var(--cat-automate)",
  "Integration":"var(--cat-integration)",
  "Maintenance":"var(--cat-maintenance)",
  "Scenario":"var(--cat-scenario)"
};
const LETTERS = ["A","B","C","D"];
const N = questions.length;
let cur = 0;
let ans = Array(N).fill(null);
let checked = Array(N).fill(false);

const q=document.getElementById('q'), opts=document.getElementById('opts'),
      fb=document.getElementById('fb'), exp=document.getElementById('exp'),
      jump=document.getElementById('jump'), catEl=document.getElementById('cat'),
      catText=document.getElementById('catText');

function init(){
  document.getElementById('masthead-sub').textContent = N + ' questions';
  questions.forEach((x,i)=>{
    let o=document.createElement('option');
    o.value=i; o.textContent='Q'+(i+1)+' · '+x[0];
    jump.appendChild(o);
  });
  render();
}

function render(){
  const [cat,txt,arr,correct,why] = questions[cur];
  const color = CAT_COLOR[cat] || 'var(--accent)';
  catText.textContent = cat;
  catEl.style.color = color;
  catEl.style.background = 'color-mix(in srgb, ' + color + ' 16%, transparent)';
  document.getElementById('count').textContent = 'Question ' + (cur+1) + ' of ' + N;
  document.getElementById('bar').style.width = (((cur+1)/N)*100) + '%';
  jump.value = cur;
  q.textContent = txt;
  opts.innerHTML = '';

  arr.forEach((x,i)=>{
    let l = document.createElement('label');
    l.className = 'option';
    if (checked[cur]) {
      if (i === correct) l.classList.add('correct');
      if (ans[cur] === i && i !== correct) l.classList.add('incorrect');
    }
    l.innerHTML =
      '<input type="radio" name="a" value="'+i+'" '+(ans[cur]===i?'checked':'')+' '+(checked[cur]?'disabled':'')+' style="display:none">' +
      '<span class="opt-letter">'+LETTERS[i]+'</span>' +
      '<span class="opt-text">'+x+'</span>';
    l.addEventListener('click', ()=>{ if(!checked[cur]){ l.querySelector('input').checked = true; } });
    opts.appendChild(l);
  });

  fb.className = 'feedback'; fb.textContent = '';
  exp.style.display = 'none';
  if (checked[cur]) feedback();

  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('check').disabled = checked[cur];
  document.getElementById('next').textContent = cur === N-1 ? 'Finish quiz' : 'Next';
  updateScore();
}

function checkAnswer(){
  const s = document.querySelector('input[name=a]:checked');
  if(!s){ alert('Select one answer first.'); return; }
  ans[cur] = +s.value; checked[cur] = true; render();
}

function feedback(){
  const c = questions[cur][3], good = ans[cur] === c;
  fb.className = 'feedback ' + (good ? 'good' : 'bad');
  fb.textContent = good ? 'Correct.' : 'Not quite — correct answer: ' + questions[cur][2][c];
  exp.textContent = questions[cur][4];
  exp.style.display = 'block';
}

function updateScore(){
  let s = 0;
  ans.forEach((a,i)=>{ if (checked[i] && a === questions[i][3]) s++; });
  document.getElementById('score').textContent = 'Score ' + s;
}

function nextQ(){ if (cur === N-1) { finish(); return; } cur++; render(); }
function prevQ(){ if (cur > 0) { cur--; render(); } }
function jumpQ(){ cur = +jump.value; render(); }

function finish(){
  let c = 0; ans.forEach((a,i)=>{ if (a === questions[i][3]) c++; });
  document.getElementById('quizPanel').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  document.getElementById('pct').textContent = c + '%';
  document.getElementById('cN').textContent = c;
  document.getElementById('wN').textContent = N - c;
  document.getElementById('ready').textContent =
    c>=90 ? 'Excellent interview readiness.' :
    c>=75 ? 'Good — review your weak categories.' :
    c>=60 ? 'Moderate — more revision recommended.' :
            'More study recommended before the interview.';

  const byCat = {};
  questions.forEach((x,i)=>{
    const cat = x[0];
    byCat[cat] = byCat[cat] || {correct:0, total:0};
    byCat[cat].total++;
    if (ans[i] === x[3]) byCat[cat].correct++;
  });
  const catbars = document.getElementById('catbars');
  catbars.innerHTML = '';
  Object.keys(byCat).forEach(cat=>{
    const {correct,total} = byCat[cat];
    const pct = Math.round((correct/total)*100);
    const color = CAT_COLOR[cat] || 'var(--accent)';
    const row = document.createElement('div');
    row.className = 'catbar-row';
    row.innerHTML =
      '<span class="catbar-name">'+cat+'</span>' +
      '<span class="catbar-track"><span class="catbar-fill" style="width:'+pct+'%;background:'+color+'"></span></span>' +
      '<span class="catbar-score">'+correct+'/'+total+'</span>';
    catbars.appendChild(row);
  });

  const review = document.getElementById('review');
  review.innerHTML = '<div class="catbreak-title" style="margin-top:8px">Review missed questions</div>';
  questions.forEach((x,i)=>{
    if (ans[i] !== x[3]) {
      const d = document.createElement('div');
      d.className = 'review-item';
      d.innerHTML =
        '<div class="rq">Q'+(i+1)+'. '+x[1]+'</div>' +
        '<div class="rc">Correct: '+x[2][x[3]]+'</div>' +
        '<div class="re">'+x[4]+'</div>';
      review.appendChild(d);
    }
  });
}

function restart(){
  cur = 0; ans = Array(N).fill(null); checked = Array(N).fill(false);
  document.getElementById('results').style.display = 'none';
  document.getElementById('quizPanel').style.display = 'block';
  render();
}

init();
</script>
